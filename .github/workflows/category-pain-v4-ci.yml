name: Category Pain V4 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/market_intelligence/category_pain_intelligence_v4.py'
      - 'workers/market_intelligence/category_pain_intelligence_v42.py'
      - 'workers/market_intelligence/category_pain_local_audit.py'
      - 'workers/market_intelligence/consumer_evidence_v4.py'
      - 'workers/market_intelligence/consumer_source_expansion_v43.py'
      - 'workers/market_intelligence/consumer_direct_social_v44.py'
      - 'workers/market_intelligence/consumer_direct_greek_v46.py'
      - 'workers/market_intelligence/consumer_searx_forum_v47.py'
      - 'workers/market_intelligence/consumer_forum_seed_crawl_v48.py'
      - 'workers/market_intelligence/consumer_verified_public_v412.py'
      - 'workers/market_intelligence/authoritative_context_v3.py'
      - 'workers/market_intelligence/test_*v4*.py'
      - 'workers/market_intelligence/test_category_pain_local_audit.py'
      - 'supabase/functions/evidence-gateway/**'
      - '.github/workflows/generic-evidence-intelligence.yml'
      - '.github/workflows/category-pain-v4-ci.yml'
  push:
    branches: [main]
    paths:
      - 'workers/market_intelligence/category_pain_intelligence_v4.py'
      - 'workers/market_intelligence/category_pain_intelligence_v42.py'
      - 'workers/market_intelligence/category_pain_local_audit.py'
      - 'workers/market_intelligence/consumer_evidence_v4.py'
      - 'workers/market_intelligence/consumer_source_expansion_v43.py'
      - 'workers/market_intelligence/consumer_direct_social_v44.py'
      - 'workers/market_intelligence/consumer_direct_greek_v46.py'
      - 'workers/market_intelligence/consumer_searx_forum_v47.py'
      - 'workers/market_intelligence/consumer_forum_seed_crawl_v48.py'
      - 'workers/market_intelligence/consumer_verified_public_v412.py'
      - 'workers/market_intelligence/authoritative_context_v3.py'
      - 'workers/market_intelligence/test_*v4*.py'
      - 'workers/market_intelligence/test_category_pain_local_audit.py'
      - 'supabase/functions/evidence-gateway/**'
      - '.github/workflows/category-pain-v4-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install evidence dependencies
        run: pip install requests trafilatura yt-dlp
      - name: Compile V4 workers
        run: python -m py_compile workers/market_intelligence/category_pain_intelligence.py workers/market_intelligence/consumer_evidence_v4.py workers/market_intelligence/consumer_source_expansion_v43.py workers/market_intelligence/consumer_direct_social_v44.py workers/market_intelligence/consumer_direct_greek_v46.py workers/market_intelligence/consumer_searx_forum_v47.py workers/market_intelligence/consumer_forum_seed_crawl_v48.py workers/market_intelligence/consumer_verified_public_v412.py workers/market_intelligence/authoritative_context_v3.py workers/market_intelligence/category_pain_intelligence_v4.py workers/market_intelligence/category_pain_local_audit.py workers/market_intelligence/category_pain_intelligence_v42.py
      - name: Test consumer extraction, verified-public and local-audit invariants
        working-directory: workers/market_intelligence
        run: python -m unittest -v test_consumer_evidence_v4.py test_consumer_direct_social_v44.py test_consumer_searx_forum_v47.py test_consumer_forum_seed_crawl_v48.py test_consumer_verified_public_v412.py test_category_pain_v4.py test_category_pain_local_audit.py
      - name: Type-check hardened evidence gateway
        run: deno check --node-modules-dir=auto supabase/functions/evidence-gateway/index.ts
      - name: Guard V4 truth and bounded-AI semantics
        run: |
          grep -R "consumer_text===true" supabase/functions/evidence-gateway/index.ts
          grep -R "marketReady" supabase/functions/evidence-gateway/index.ts
          grep -R "context_only" workers/market_intelligence/authoritative_context_v3.py
          grep -R "SERP snippets are discovery-only" workers/market_intelligence/category_pain_intelligence_v4.py
          grep -R "not search volume" workers/market_intelligence/category_pain_intelligence_v4.py
          grep -R "_EXTRACT_LOCK" workers/market_intelligence/category_pain_intelligence_v42.py
          grep -R "observed public user statement; not a population estimate" workers/market_intelligence/consumer_direct_social_v44.py
          grep -R "search snippets are discovery diagnostics only" workers/market_intelligence/consumer_searx_forum_v47.py
          grep -R "metadata never become pain evidence" workers/market_intelligence/consumer_forum_seed_crawl_v48.py
          grep -R "actual text must pass the same" workers/market_intelligence/consumer_forum_seed_crawl_v48.py
          grep -R "seed/search metadata excluded from proof" workers/market_intelligence/consumer_verified_public_v412.py
          grep -R "source_diverse_compact_v2" workers/market_intelligence/category_pain_local_audit.py
          grep -R "category-pain-local-v3-concise" workers/market_intelligence/category_pain_local_audit.py
          grep -R "CATEGORY_PAIN_AUDIT_MAX_EVIDENCE" workers/market_intelligence/category_pain_local_audit.py
