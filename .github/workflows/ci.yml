name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install
      - run: npm run test:design-v2
      - run: npm run test:demand-v3
      - run: python -m py_compile workers/demand_intelligence_v3/fuzzy_fusion.py workers/demand_intelligence_v3/forecast_ensemble.py workers/market_intelligence/category_pain_intelligence.py
      - run: deno check --node-modules-dir=auto supabase/functions/demand-intelligence-gateway/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/evidence-gateway/index.ts
      - run: npm run build
