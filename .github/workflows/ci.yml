name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install
      - name: Install product worker test dependencies
        run: pip install -r workers/product_intelligence/requirements.txt
      - run: npm run test:design-v2
      - run: npm run test:demand-v3
      - name: Compile intelligence workers
        run: python -m py_compile workers/demand_intelligence_v3/fuzzy_fusion.py workers/demand_intelligence_v3/forecast_ensemble.py workers/demand_intelligence_v3/graph_rag.py workers/demand_intelligence_v3/causal_skeptic.py workers/demand_intelligence_v3/deep_lab.py workers/demand_intelligence_v3/run_autonomous.py workers/product_intelligence/product_run_lifecycle.py workers/product_intelligence/product_ranking_v3.py workers/product_intelligence/product_ranking_v32.py workers/product_intelligence/product_ranking_v363_production.py workers/product_intelligence/creative_asset_renderer.py workers/market_intelligence/category_pain_intelligence.py workers/market_intelligence/authoritative_context_v2.py workers/market_intelligence/category_pain_intelligence_v31.py workers/ai_runtime/task_contract.py workers/ai_runtime/router.py
      - name: Autopilot AI task-router contract tests
        working-directory: workers/ai_runtime
        run: python -m unittest -v test_router.py
      - name: Ranking + durable creative regression tests
        working-directory: workers/product_intelligence
        run: python -m unittest -v test_product_ranking_v3.py test_creative_asset_renderer.py
      - run: deno check --node-modules-dir=auto supabase/functions/demand-intelligence-gateway/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/demand-model-lab-gateway/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/product-ranking-gateway/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/product-creative-gateway/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/product-run-observability-gateway/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/admin-intelligence-gateway/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/evidence-gateway/index.ts
      - run: npm run build
      - name: Package controlled Vercel deploy source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: socialmarket-vercel-source
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            app/**
            components/**
            config/**
            lib/**
            public/**
            package.json
            package-lock.json
            jsconfig.json
            next.config.mjs
            vercel.json
