name: Design V2 CI

on:
  push:
    branches:
      - design-v2-demand-intelligence
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'agents/skills/**'
      - 'scripts/validate-design-v2.mjs'
      - 'package.json'
      - '.github/workflows/design-v2-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate analytics design contract
        run: npm run test:design-v2
      - name: Production build
        run: npm run build
