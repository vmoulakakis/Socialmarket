name: Full Agentic Pain-Gap Engine

on:
  workflow_dispatch:
    inputs:
      max_products:
        description: 'Bounded product context for this run'
        required: false
        default: '12'
      max_searches:
        description: 'Maximum research queries'
        required: false
        default: '12'
      free_model_calls:
        description: 'Maximum local/free semantic calls'
        required: false
        default: '8'
  push:
    branches: [main]
    paths:
      - '.github/agentic-trigger'

concurrency:
  group: socialmarket-full-agentic-gap
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  models: read

jobs:
  pain-gap-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SEARXNG_URL: http://127.0.0.1:8080
      LOCAL_OLLAMA_URL: http://127.0.0.1:11434
      LOCAL_OLLAMA_MODEL: qwen3.5:0.8b
      LOCAL_EMBED_MODEL: qwen3-embedding:0.6b
      LOCAL_MODEL_TIMEOUT_SECONDS: '45'
      PAIN_CLUSTER_COSINE: '0.68'
      MAX_FREE_MODEL_CALLS: ${{ inputs.free_model_calls || '8' }}
      ENABLE_PAID_REMOTE: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deterministic and agent runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r workers/market_intelligence/requirements.txt
          pip install -r workers/agentic_intelligence/requirements.txt

      - name: Start no-key SearXNG discovery service
        run: |
          mkdir -p .searxng
          cat > .searxng/settings.yml <<'YAML'
          use_default_settings: true
          general:
            debug: false
          search:
            safe_search: 1
            autocomplete: ''
            formats:
              - html
              - json
          server:
            secret_key: 'socialmarket-ci-ephemeral-only'
            limiter: false
            image_proxy: false
          YAML
          docker run -d --name socialmarket-searxng \
            -p 8080:8080 \
            -v "$PWD/.searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            docker.io/searxng/searxng:latest
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8080/' >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS --get 'http://127.0.0.1:8080/search' \
            --data-urlencode 'q=product review' \
            --data 'format=json' > /tmp/searx-health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/searx-health.json'))
          print({'searx_results':len(d.get('results') or []),'unresponsive_engines':len(d.get('unresponsive_engines') or [])})
          if not isinstance(d.get('results'),list): raise SystemExit('SearXNG JSON discovery unavailable')
          PY

      - name: Start local open-weight Qwen runtime
        run: |
          docker run -d --name socialmarket-ollama -p 11434:11434 ollama/ollama:latest
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:11434/api/tags' >/dev/null; then break; fi
            sleep 2
          done
          docker exec socialmarket-ollama ollama pull qwen3.5:0.8b
          docker exec socialmarket-ollama ollama pull qwen3-embedding:0.6b
          curl -fsS 'http://127.0.0.1:11434/api/tags' | head -c 1500

      - name: Run full evidence-first agentic circuit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python workers/agentic_intelligence/run_pipeline_v7.py \
            --scope GR \
            --max-products '${{ inputs.max_products || '12' }}' \
            --max-searches '${{ inputs.max_searches || '12' }}' \
            --free-model-calls '${{ inputs.free_model_calls || '8' }}' \
            | tee full-agentic-run.json

      - name: Populate AI vector database with local Qwen embeddings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python workers/agentic_intelligence/vectorize_local.py --product-limit 500 \
            | tee full-vector-run.json

      - name: Upload audit summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-agentic-pain-gap-run
          path: |
            full-agentic-run.json
            full-vector-run.json
          if-no-files-found: ignore
          retention-days: 7
