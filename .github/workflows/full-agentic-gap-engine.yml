name: Full Agentic Pain-Gap Engine

on:
  workflow_dispatch:
    inputs:
      max_products:
        description: 'Bounded product context for this run'
        required: false
        default: '12'
      max_searches:
        description: 'Maximum research queries'
        required: false
        default: '24'
      free_model_calls:
        description: 'Maximum GitHub Models free semantic calls'
        required: false
        default: '8'
  push:
    branches: [main]
    paths:
      - '.github/agentic-trigger'

concurrency:
  group: socialmarket-full-agentic-gap
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  models: read

jobs:
  pain-gap-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEARXNG_URL: http://127.0.0.1:8080
      MAX_FREE_MODEL_CALLS: ${{ inputs.free_model_calls || '8' }}
      ENABLE_PAID_REMOTE: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deterministic and agent runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r workers/market_intelligence/requirements.txt
          pip install -r workers/agentic_intelligence/requirements.txt

      - name: Start no-key SearXNG discovery service
        continue-on-error: true
        run: |
          docker run -d --name socialmarket-searxng -p 8080:8080 docker.io/searxng/searxng:latest
          for i in {1..20}; do
            if curl -fsS 'http://127.0.0.1:8080/' >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs socialmarket-searxng || true
          exit 1

      - name: Run full evidence-first agentic circuit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python workers/agentic_intelligence/run_pipeline.py \
            --scope GR \
            --max-products '${{ inputs.max_products || '12' }}' \
            --max-searches '${{ inputs.max_searches || '24' }}' \
            --free-model-calls '${{ inputs.free_model_calls || '8' }}' \
            | tee full-agentic-run.json

      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-agentic-pain-gap-run
          path: full-agentic-run.json
          if-no-files-found: ignore
          retention-days: 7
