name: Full Linkwise Feed - EUR15 Streaming Ingestion
on:
  push:
    branches: [feat/agentic-shopper-evidence-gate-20261106]
    paths: ['.github/workflows/full-feed-discovery.yml']
  workflow_dispatch:
    inputs:
      top:
        description: Ranked research shortlist (all qualifying rows are persisted)
        type: choice
        options: ["100", "250", "500", "1000"]
        default: "500"
      expected_records:
        description: Minimum expected input count; smaller sources remain PARTIAL
        type: string
        default: "3500000"
permissions:
  contents: read
  id-token: write
concurrency:
  group: socialmarket-full-feed-research
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
      LINKWISE_FULL_FEED_URL: "${{ secrets.LINKWISE_FULL_FEED_URL }}"
      TOP: "${{ github.event_name == 'push' && '500' || inputs.top }}"
      EXPECTED_RECORDS: "${{ github.event_name == 'push' && '3500000' || inputs.expected_records }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned streaming dependencies
        run: python -m pip install "ijson==3.4.0" "requests==2.32.3"
      - name: Verify EUR15 admission, streaming and recovery contracts
        run: python -m unittest discover -s workers/product_intelligence -p 'test_full_feed_streaming.py' -v
      - name: Stream every source row, persist every calculated EUR15+ candidate
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import os, subprocess, sys
          columns="product_id,product_name,description,category,tracking_url,thumb_url,image_url,in_stock,availability,valid_from,valid_to,currency,price,full_price,discount,times_bought"
          # Known taxonomy scope, not a claim of publisher-confirmed completeness.
          categories=",".join(str(i) for i in range(1,154))
          default="https://affiliate.linkwi.se/feeds/1.2/CD104/programs-all/columns-"+columns+"/catinc-"+categories+"/catex-0/proginc-0/progex-0/feed.json"
          source=os.environ.get("LINKWISE_FULL_FEED_URL") or default
          command=[sys.executable,"workers/product_intelligence/all_feed_opportunity_discovery.py",
            "--streaming","--feed-url",source,"--commission-rules","vmdb",
            "--signals","docs/research/2026-11-08-streaming-market-signals.json",
            "--top",os.environ["TOP"],"--expected-records",os.environ["EXPECTED_RECORDS"],
            "--checkpoint","full-feed-stage.sqlite3","--output","affiliate-opportunities.json",
            "--persist-research"]
          raise SystemExit(subprocess.call(command))
          PYCODE
      - name: Retain counts, research shortlist and durable eligible inventory checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-feed-eur15-research
          retention-days: 14
          if-no-files-found: warn
          path: |
            affiliate-opportunities.json
            full-feed-stage.sqlite3
            full-feed-stage.sqlite3-wal
            full-feed-stage.sqlite3-shm
