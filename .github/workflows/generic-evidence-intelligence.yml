name: Semantic Category Pain Intelligence

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Canonical taxonomy nodes to research (1-100)'
        required: false
        default: '8'
  schedule:
    - cron: '15 2 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: semantic-category-pain-intelligence
  cancel-in-progress: true

jobs:
  collect-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EVIDENCE_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/evidence-gateway
      SEARXNG_BASE_URL: http://127.0.0.1:8080
      CATEGORY_PAIN_LIMIT: ${{ inputs.limit || '80' }}
      CATEGORY_PAIN_WORKERS: '3'
      CATEGORY_PAIN_AI_BATCH: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evidence dependencies
        run: pip install requests
      - name: Preflight evidence gateway and AI skeptic
        run: |
          HEALTH=$(curl -fsS "$EVIDENCE_GATEWAY")
          echo "$HEALTH"
          python - <<'PY' "$HEALTH"
          import json,sys
          h=json.loads(sys.argv[1])
          assert h.get('ok') is True
          assert h.get('deepseek_configured') is True, 'DeepSeek audit must be configured; fail closed instead of silently accepting un-audited pains'
          PY
      - name: Start ephemeral SearXNG
        run: |
          docker run -d --name socialmarket-searxng -p 8080:8080 -v "$PWD/workers/market_intelligence/searxng-settings.yml:/etc/searxng/settings.yml:ro" searxng/searxng:latest
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs socialmarket-searxng || true
          exit 1
      - name: Compile semantic pain worker
        run: python -m py_compile workers/market_intelligence/semantic_taxonomy.py workers/market_intelligence/category_pain_intelligence.py workers/market_intelligence/authoritative_context_v2.py workers/market_intelligence/category_pain_intelligence_v31.py
      - name: Run canonical Greek category pain intelligence
        working-directory: workers/market_intelligence
        run: python category_pain_intelligence_v31.py | tee semantic-category-pain-output.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-category-pain-output
          retention-days: 30
          path: workers/market_intelligence/semantic-category-pain-output.json
