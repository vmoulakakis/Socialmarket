name: Semantic Category Pain Intelligence

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Canonical taxonomy nodes to research (1-100)'
        required: false
        default: '12'
  schedule:
    - cron: '15 2 * * *'
  push:
    branches: [main]
    paths:
      - 'workers/market_intelligence/category_pain_intelligence_v4.py'
      - 'workers/market_intelligence/consumer_evidence_v4.py'
      - 'workers/market_intelligence/authoritative_context_v3.py'
      - 'workers/market_intelligence/market_query_aliases.py'
      - 'workers/market_intelligence/semantic_taxonomy.py'
      - '.github/workflows/generic-evidence-intelligence.yml'
      - 'supabase/functions/evidence-gateway/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: semantic-category-pain-intelligence
  cancel-in-progress: true

jobs:
  collect-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EVIDENCE_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/evidence-gateway
      SEARXNG_BASE_URL: http://127.0.0.1:8080
      CATEGORY_PAIN_LIMIT: ${{ github.event_name == 'push' && '8' || inputs.limit || '80' }}
      CATEGORY_PAIN_WORKERS: '3'
      CATEGORY_PAIN_AI_BATCH: '4'
      CATEGORY_CONSUMER_FETCH_WORKERS: '6'
      CATEGORY_CONSUMER_MAX_URLS: '36'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deep evidence dependencies
        run: pip install requests trafilatura
      - name: Preflight exact V4 evidence gateway and AI skeptic
        run: |
          HEALTH=$(curl -fsS "$EVIDENCE_GATEWAY")
          echo "$HEALTH"
          python - <<'PY' "$HEALTH"
          import json,sys
          h=json.loads(sys.argv[1])
          assert h.get('ok') is True
          assert str(h.get('version')) == '4.0', f"Category Pain V4 requires evidence-gateway 4.0; got {h.get('version')}"
          assert h.get('collection_type') == 'semantic_category_pain_v4', f"Wrong collection type: {h.get('collection_type')}"
          assert h.get('retrieval') == 'greek_consumer_evidence_v4+direct_authoritative_context_v3', f"Wrong retrieval contract: {h.get('retrieval')}"
          assert h.get('deepseek_configured') is True, 'DeepSeek audit must be configured; fail closed instead of silently accepting un-audited pains'
          PY
      - name: Start ephemeral SearXNG discovery engine
        run: |
          docker run -d --name socialmarket-searxng -p 8080:8080 -v "$PWD/workers/market_intelligence/searxng-settings.yml:/etc/searxng/settings.yml:ro" searxng/searxng:latest
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs socialmarket-searxng || true
          exit 1
      - name: Compile Category Pain V4 workers
        run: python -m py_compile workers/market_intelligence/semantic_taxonomy.py workers/market_intelligence/market_query_aliases.py workers/market_intelligence/category_pain_intelligence.py workers/market_intelligence/consumer_evidence_v4.py workers/market_intelligence/authoritative_context_v3.py workers/market_intelligence/category_pain_intelligence_v4.py
      - name: Run canonical Greek Category Pain V4
        working-directory: workers/market_intelligence
        shell: bash
        run: |
          set -euo pipefail
          python category_pain_intelligence_v4.py | tee semantic-category-pain-output.json
      - name: Assert structured research completion
        working-directory: workers/market_intelligence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lines=[x for x in Path('semantic-category-pain-output.json').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed=[]
          for line in lines:
              try: parsed.append(json.loads(line))
              except Exception: pass
          summaries=[x for x in parsed if x.get('status') in ('completed','completed_with_failures') and 'processed' in x]
          assert summaries, 'Missing structured Category Pain V4 completion summary'
          summary=summaries[-1]
          assert summary.get('failed') == 0, f"Category Pain V4 reported failures: {summary}"
          assert summary.get('status') == 'completed', f"Research did not complete cleanly: {summary}"
          print(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-category-pain-v4-output
          retention-days: 30
          path: workers/market_intelligence/semantic-category-pain-output.json
