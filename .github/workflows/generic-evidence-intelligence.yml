name: Semantic Category Pain Intelligence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generic-evidence-intelligence.yml'
      - '.github/category-pain-final-trigger'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Canonical taxonomy nodes to research (1-100)'
        required: false
        default: '20'
  workflow_run:
    workflows: ['Merchant Intelligence V4.3 Semantic']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: semantic-category-pain-intelligence
  cancel-in-progress: true

jobs:
  collect-audit:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EVIDENCE_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/evidence-gateway
      AI_TASK_RUNTIME_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/ai-task-runtime-gateway
      AI_TASK_RUNTIME_DURABLE: 'true'
      CATEGORY_PAIN_AI_ROUTE: local_router
      LOCAL_OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_VERSION: v0.33.3
      OLLAMA_LINUX_AMD64_SHA256: c13cea8f3389db4145f8a6cb88d1747242a48639d7c13e3bda7c1ebdc6eebb2f
      CATEGORY_PAIN_TIER1_MODEL: qwen3.5:4b
      CATEGORY_PAIN_TIER1_MODEL_DIGEST_PREFIX: 2a654d98e6fb
      CATEGORY_PAIN_TIER2_MODEL: ''
      SEARXNG_BASE_URL: http://127.0.0.1:8080
      SEARXNG_IMAGE: searxng/searxng:2026.9.5-c7f3080aa
      CATEGORY_PAIN_LIMIT: ${{ github.event_name == 'push' && '1' || inputs.limit || '80' }}
      CATEGORY_PAIN_WORKERS: '3'
      CATEGORY_PAIN_AI_BATCH: '1'
      CATEGORY_CONSUMER_FETCH_WORKERS: '6'
      CATEGORY_CONSUMER_MAX_URLS: '72'
      CATEGORY_PAIN_REQUIRE_VALIDATED_OUTPUT: ${{ github.event_name == 'push' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned deep evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r workers/market_intelligence/requirements-category-pain.txt
          python -m pip freeze | sort > category-pain-installed.txt
      - name: Preflight evidence persistence and AI runtime gateways
        run: |
          EVIDENCE_HEALTH=$(curl -fsS "$EVIDENCE_GATEWAY")
          AI_RUNTIME_HEALTH=$(curl -fsS "$AI_TASK_RUNTIME_GATEWAY")
          echo "$EVIDENCE_HEALTH"
          echo "$AI_RUNTIME_HEALTH"
          python - <<'PY' "$EVIDENCE_HEALTH" "$AI_RUNTIME_HEALTH"
          import json,sys
          e=json.loads(sys.argv[1]);a=json.loads(sys.argv[2])
          assert e.get('ok') is True
          assert str(e.get('version')) == '4.0', f"Category Pain requires compatible evidence-gateway 4.0; got {e.get('version')}"
          assert e.get('collection_type') == 'semantic_category_pain_v4', f"Wrong collection type: {e.get('collection_type')}"
          assert e.get('retrieval') == 'greek_consumer_evidence_v4+direct_authoritative_context_v3', f"Wrong retrieval contract: {e.get('retrieval')}"
          assert a.get('ok') is True
          assert a.get('contract') == 'autopilot-ai-task-v1', f"Wrong AI runtime contract: {a.get('contract')}"
          assert a.get('stores_raw_prompts') is False
          assert a.get('stores_raw_evidence') is False
          PY
      - name: Install checksum-verified Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/ollama-linux-amd64-${OLLAMA_VERSION}.tar.zst"
          curl -fsSL "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" -o "$archive"
          echo "${OLLAMA_LINUX_AMD64_SHA256}  ${archive}" | sha256sum -c -
          sudo tar --zstd -xf "$archive" -C /usr
          ollama --version
      - name: Start local Ollama and load pinned Category Pain model
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -fsS "$LOCAL_OLLAMA_URL/api/tags" >/dev/null 2>&1; then
            nohup ollama serve > /tmp/ollama-category-pain.log 2>&1 &
          fi
          for i in $(seq 1 40); do
            if curl -fsS "$LOCAL_OLLAMA_URL/api/tags" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$LOCAL_OLLAMA_URL/api/tags" >/dev/null
          ollama pull "$CATEGORY_PAIN_TIER1_MODEL"
          ollama list
          model_id="$(ollama list | awk -v model="$CATEGORY_PAIN_TIER1_MODEL" '$1==model {print $2; exit}')"
          test -n "$model_id" || (echo "Unable to resolve model id for $CATEGORY_PAIN_TIER1_MODEL" && exit 1)
          case "$model_id" in
            "${CATEGORY_PAIN_TIER1_MODEL_DIGEST_PREFIX}"*) ;;
            *) echo "Category Pain model digest mismatch: expected ${CATEGORY_PAIN_TIER1_MODEL_DIGEST_PREFIX}*, got ${model_id}"; exit 1 ;;
          esac
      - name: Start pinned ephemeral SearXNG discovery engine
        run: |
          docker pull "$SEARXNG_IMAGE"
          docker image inspect "$SEARXNG_IMAGE" --format '{{json .RepoDigests}}'
          docker run -d --name socialmarket-searxng -p 8080:8080 -v "$PWD/workers/market_intelligence/searxng-settings.yml:/etc/searxng/settings.yml:ro" "$SEARXNG_IMAGE"
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs socialmarket-searxng || true
          exit 1
      - name: Compile Category Pain local-router workers
        run: python -m py_compile workers/ai_runtime/task_contract.py workers/ai_runtime/router.py workers/ai_runtime/ollama_executor.py workers/ai_runtime/supabase_runtime.py workers/market_intelligence/semantic_taxonomy.py workers/market_intelligence/market_query_aliases.py workers/market_intelligence/category_pain_intelligence.py workers/market_intelligence/consumer_evidence_v4.py workers/market_intelligence/consumer_source_expansion_v43.py workers/market_intelligence/consumer_direct_social_v44.py workers/market_intelligence/consumer_direct_greek_v46.py workers/market_intelligence/consumer_searx_forum_v47.py workers/market_intelligence/consumer_forum_seed_crawl_v48.py workers/market_intelligence/consumer_verified_public_v412.py workers/market_intelligence/niche_product_prior_v45.py workers/market_intelligence/niche_keyword_binding_v45.py workers/market_intelligence/authoritative_context_v3.py workers/market_intelligence/category_pain_intelligence_v4.py workers/market_intelligence/category_pain_local_audit.py workers/market_intelligence/category_pain_intelligence_v42.py
      - name: Run Greece-first Niche Category Pain with local AI Task Router
        working-directory: workers/market_intelligence
        shell: bash
        run: |
          set -euo pipefail
          python category_pain_intelligence_v42.py | tee semantic-category-pain-output.json
      - name: Assert structured research completion and useful intelligence
        working-directory: workers/market_intelligence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines=[x for x in Path('semantic-category-pain-output.json').read_text(encoding='utf-8').splitlines() if x.strip()]
          parsed=[]
          for line in lines:
              try: parsed.append(json.loads(line))
              except Exception: pass
          summaries=[x for x in parsed if x.get('status') in ('completed','completed_with_failures') and 'processed' in x]
          assert summaries, 'Missing structured Category Pain completion summary'
          summary=summaries[-1]
          assert summary.get('failed') == 0, f"Category Pain reported failures: {summary}"
          assert summary.get('status') == 'completed', f"Research did not complete cleanly: {summary}"
          results=[x for x in parsed if x.get('ok') is True and x.get('category')]
          pain_candidates=sum(int(x.get('pain_candidates') or 0) for x in results)
          validated_clusters=sum(int(x.get('validated_clusters') or 0) for x in results)
          qualification=os.getenv('CATEGORY_PAIN_REQUIRE_VALIDATED_OUTPUT','false').strip().lower() == 'true'
          quality={'processed':summary.get('processed'),'pain_candidates':pain_candidates,'validated_clusters':validated_clusters,'qualification_required':qualification}
          print(quality)
          if qualification:
              assert summary.get('processed') == 1, f'Explicit qualification must process exactly one target: {quality}'
              assert pain_candidates > 0, f'Category Pain qualification produced zero consumer pain candidates: {quality}'
              assert validated_clusters > 0, f'Category Pain qualification produced zero validated clusters: {quality}'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-category-pain-local-router-output
          retention-days: 30
          path: |
            workers/market_intelligence/semantic-category-pain-output.json
            category-pain-installed.txt
            /tmp/ollama-category-pain.log
