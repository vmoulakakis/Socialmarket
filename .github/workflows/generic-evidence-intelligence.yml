name: Semantic Category Pain Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
  push:
    branches: [main]
    paths:
      - 'workers/market_intelligence/category_pain_intelligence.py'
      - 'workers/market_intelligence/semantic_taxonomy.py'
      - '.github/workflows/generic-evidence-intelligence.yml'
      - 'supabase/functions/evidence-gateway/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: semantic-category-pain-intelligence
  cancel-in-progress: false

jobs:
  collect-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EVIDENCE_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/evidence-gateway
      SEARXNG_BASE_URL: http://127.0.0.1:8080
      CATEGORY_PAIN_LIMIT: '80'
      CATEGORY_PAIN_WORKERS: '6'
      CATEGORY_PAIN_AI_BATCH: '6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evidence dependencies
        run: pip install requests
      - name: Start ephemeral SearXNG
        run: |
          docker run -d --name socialmarket-searxng -p 8080:8080 -v "$PWD/workers/market_intelligence/searxng-settings.yml:/etc/searxng/settings.yml:ro" searxng/searxng:latest
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs socialmarket-searxng || true
          exit 1
      - name: Compile semantic pain worker
        run: python -m py_compile workers/market_intelligence/semantic_taxonomy.py workers/market_intelligence/category_pain_intelligence.py
      - name: Run canonical Greek category pain intelligence
        working-directory: workers/market_intelligence
        run: python category_pain_intelligence.py | tee semantic-category-pain-output.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-category-pain-output
          retention-days: 30
          path: workers/market_intelligence/semantic-category-pain-output.json
