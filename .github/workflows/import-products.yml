name: Import Product Feed
on:
  workflow_dispatch:
    inputs:
      shard_size:
        description: Products per gzip shard
        required: false
        default: '25000'
  push:
    branches: [main]
    paths:
      - '.github/import-trigger'
permissions:
  contents: read
  id-token: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DRIVE_FILE_ID: 1oGnQr4uz3dxfHhydEYkYsrXeZJjR65HT
      SOURCE_NAME: Linkwise Products
      SOURCE_URL: https://drive.google.com/file/d/1oGnQr4uz3dxfHhydEYkYsrXeZJjR65HT/view?usp=drive_link
      SUPABASE_WORKER_GATEWAY: https://prrehmcvpyhupvlhtbzg.supabase.co/functions/v1/github-worker-gateway
      SHARD_SIZE: ${{ inputs.shard_size || '25000' }}
      MIN_PRICE_EUR: '150'
      MIN_VALIDITY_DAYS: '20'
      MARKET_TIMEZONE: Europe/Athens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r workers/market_intelligence/requirements.txt
      - name: Download Drive feed
        run: gdown --id "$DRIVE_FILE_ID" -O linkwise-products.json
      - name: Stream and shard
        run: python workers/market_intelligence/stream_feed.py linkwise-products.json --out shards --size "$SHARD_SIZE"
      - name: Profile hard gates
        run: python workers/market_intelligence/profile_shards.py
      - uses: actions/upload-artifact@v4
        with:
          name: feed-profile
          path: feed-profile.json
      - name: Import eligible non-travel products through OIDC gateway
        run: python workers/market_intelligence/import_shards.py
