name: Import Product Feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/import-trigger'
permissions:
  contents: read
  id-token: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DRIVE_FILE_ID: 1oGnQr4uz3dxfHhydEYkYsrXeZJjR65HT
      SOURCE_NAME: Linkwise Products
      SOURCE_URL: https://drive.google.com/file/d/1oGnQr4uz3dxfHhydEYkYsrXeZJjR65HT/view?usp=drive_link
      SUPABASE_WORKER_GATEWAY: https://prrehmcvpyhupvlhtbzg.supabase.co/functions/v1/github-worker-gateway
      MIN_PRICE_EUR: '100'
      MIN_VALIDITY_DAYS: '20'
      MARKET_TIMEZONE: Europe/Athens
      STREAM_GLOBAL_POOL: '25000'
      STREAM_PER_CATEGORY_POOL: '40'
      STREAM_MAX_CANDIDATE_POOL: '35000'
      MERCHANT_EXTERNAL_RESEARCH_LIMIT: '220'
      FINAL_PRODUCT_LIMIT: '1000'
      FINAL_MAX_PER_MERCHANT: '80'
      FINAL_MAX_PER_CATEGORY: '120'
      FINAL_MAX_PER_BRAND: '100'
      FINAL_MIN_SCORE: '48'
      SEARXNG_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r workers/market_intelligence/requirements.txt
      - name: Download source feed to runner disk
        run: gdown --id "$DRIVE_FILE_ID" -O linkwise-products.json
      - name: Full streaming scan and bounded shortlist
        run: python workers/market_intelligence/smart_stream_select.py linkwise-products.json | tee stream-selection-output.json
      - name: Start optional ephemeral SearXNG
        continue-on-error: true
        run: |
          docker run -d --name socialmarket-searxng -p 8080:8080 -v "$PWD/workers/market_intelligence/searxng-settings.yml:/etc/searxng/settings.yml:ro" searxng/searxng:latest
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs socialmarket-searxng || true
          exit 1
      - name: Research trust and online visibility of shortlist merchants
        run: python workers/market_intelligence/research_pool_merchants.py | tee merchant-pool-output.json
      - name: Dedupe and select trusted low-competition top 1000
        run: python workers/market_intelligence/final_top1000.py | tee final-selection-output.json
      - name: Import only final selected products
        run: python workers/market_intelligence/import_final_selection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-selection-profile
          path: |
            stream-profile.json
            merchant-stream-stats.json
            category-stream-stats.json
            merchant-pool-research.json
            final-selection-report.json
            final-selection.jsonl
