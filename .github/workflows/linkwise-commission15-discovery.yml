name: Linkwise full-catalog discovery — commission EUR15 only

# No auto-publishing or paid LLM. Feature branch change runs 1000-row pilot.
# Full multi-million row streaming scan is an explicit manual action.
on:
  push:
    branches: [feat/agentic-shopper-evidence-gate-20261106]
    paths: ['.github/workflows/linkwise-commission15-discovery.yml']
  workflow_dispatch:
    inputs:
      scan_scope:
        description: 'Pilot (1000 records) or full source feed'
        required: true
        type: choice
        default: pilot
        options: [pilot, full]

permissions:
  contents: read
  id-token: write

concurrency:
  group: socialmarket-linkwise-commission15-discovery
  cancel-in-progress: false

jobs:
  commission15-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      LINKWISE_FULL_CATALOG_URL: 'https://affiliate.linkwi.se/feeds/1.2/CD104/programs-all/columns-product_id,model_name,product_name,description,category,brand_name,tracking_url,thumb_url,image_url,in_stock,availability,valid_from,valid_to,on_sale,currency,price,full_price,discount,city,times_bought,longitude,latitude,address,size,colour,custom,extra_images,variations/catinc-1,3,5,9,15,67,19,21,27,31,33,35,37,39,41,43,45,47,137,49,150,51,53,55,57,59,61,69,81,65,133,148,71,73,75,77,79,83,85,87,91,97,101,103,105,107,111,113,115,117,151,119,123,127,129,153,131/catex-0/proginc-0/progex-0/feed.json'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned streaming dependencies
        run: python -m pip install --disable-pip-version-check "requests==2.32.3" "ijson==3.4.0"
      - name: Verify admission and score contracts
        run: python -m unittest discover -s workers/product_intelligence -p 'test_commission15_discovery.py' -v
      - name: Scan original Linkwise catalog with bounded memory
        env:
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_scope || 'pilot' }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = full ]; then
            python workers/product_intelligence/linkwise_commission15_discovery.py \
              --feed-url "$LINKWISE_FULL_CATALOG_URL" --max-records 0 \
              --per-problem 32 --upload \
              --output commission15-discovery-summary.json
          else
            echo "Bounded pilot only, NOT a complete 3.5 million row scan."
            python workers/product_intelligence/linkwise_commission15_discovery.py \
              --feed-url "$LINKWISE_FULL_CATALOG_URL" --max-records 1000 \
              --per-problem 16 --upload \
              --output commission15-discovery-summary.json
          fi
      - name: Retain audit summary, never the bulk feed
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commission15-discovery-audit
          retention-days: 14
          if-no-files-found: warn
          path: commission15-discovery-summary.json
