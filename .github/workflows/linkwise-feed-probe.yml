name: Linkwise Direct Feed Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/linkwise-feed-probe.yml'
      - 'workers/product_intelligence/linkwise_direct_feed.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests ijson
      - name: Probe direct Linkwise dynamic-feed fields
        run: python workers/product_intelligence/linkwise_direct_feed.py --probe
