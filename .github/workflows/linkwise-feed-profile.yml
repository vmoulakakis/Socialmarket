name: Linkwise Feed Profile

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/linkwise-feed-profile.yml'
      - 'workers/linkwise_feed_profiler/**'

concurrency:
  group: linkwise-full-feed-profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Stream and measure complete Linkwise joined-program feed
        env:
          LINKWISE_FEED_URL: 'https://affiliate.linkwi.se/feeds/1.2/CD104/programs-joined/columns-product_id,sku,model_name,product_name,description,category,tracking_url,thumb_url,image_url,in_stock,valid_from,valid_to,on_sale,price,discount,times_bought,program_id,program_name,extra_images/catinc-1,3,5,9,15,67,19,21,27,31,33,35,37,39,41,43,45,47,137,49,150,51,53,55,57,59,61,69,81,65,133,148,71,73,75,77,79,83,85,87,91,97,101,103,105,107,111,113,115,117,151,119,123,127,129,153,131/catex-0/proginc-0/progex-0/feed.json'
          LINKWISE_PROFILE_REPORT: linkwise_feed_profile.json
          PYTHONUNBUFFERED: '1'
        run: python workers/linkwise_feed_profiler/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkwise-feed-profile
          path: linkwise_feed_profile.json
          if-no-files-found: ignore
          retention-days: 14
