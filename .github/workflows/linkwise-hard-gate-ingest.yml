name: Linkwise Hard Gate Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: linkwise-hard-gate-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests ijson
      - name: Stream, gate and persist all eligible offers
        env:
          LINKWISE_FEED_URL: ${{ secrets.LINKWISE_FEED_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_EXPECTED_COMMISSION_EUR: '10'
          UPSERT_BATCH_SIZE: '500'
          CHECKPOINT_EVERY: '10000'
          PYTHONUNBUFFERED: '1'
        run: python workers/linkwise_hard_gate_ingest/run.py
