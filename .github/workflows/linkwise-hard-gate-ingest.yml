name: Linkwise Hard Gate Ingest

on:
  workflow_dispatch:
  push:
    branches:
      - vmdb/backend-v2-commerce-intelligence
    paths:
      - 'workers/linkwise_hard_gate_ingest/**'
      - '.github/workflows/linkwise-hard-gate-ingest.yml'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  id-token: write

concurrency:
  group: linkwise-hard-gate-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests ijson
      - name: Get Supabase gateway OIDC token
        id: oidc
        shell: bash
        run: |
          TOKEN=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=socialmarket-supabase-worker" | python -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Stream, gate and persist all eligible offers
        env:
          LINKWISE_FEED_URL: 'https://affiliate.linkwi.se/feeds/1.2/CD104/programs-joined/columns-product_id,model_name,product_name,description,tracking_url,in_stock,valid_from,valid_to,on_sale,extra_images/catinc-1,3,5,9,15,67,19,21,27,31,33,35,37,39,41,43,45,47,137,49,150,51,53,55,57,59,61,69,81,65,133,148,71,73,75,77,79,83,85,87,91,97,101,103,105,107,111,113,115,117,151,119,123,127,129,153,131/catex-0/proginc-0/progex-0/feed.json'
          SUPABASE_GATEWAY_URL: 'https://gqpbskssrvpfjtujwezc.supabase.co/functions/v1/github-worker-gateway'
          SUPABASE_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          MIN_EXPECTED_COMMISSION_EUR: '10'
          UPSERT_BATCH_SIZE: '500'
          CHECKPOINT_EVERY: '10000'
          PYTHONUNBUFFERED: '1'
        run: python workers/linkwise_hard_gate_ingest/run.py
