name: Linkwise Top100 Commission Ingest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linkwise-top100-commission.yml'
      - 'workers/product_intelligence/linkwise_top100_commission.py'
      - 'supabase/functions/github-worker-gateway/index.ts'
  schedule:
    - cron: '25 4 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: linkwise-top100-commission
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_WORKER_GATEWAY: https://gqpbskssrvpfjtujwezc.supabase.co/functions/v1/github-worker-gateway
      MIN_EXPECTED_COMMISSION_EUR: '12'
      MAX_PRODUCTS: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install streaming dependencies
        run: pip install requests ijson
      - name: Ingest top 100 Linkwise products above EUR 12 commission
        run: python workers/product_intelligence/linkwise_top100_commission.py
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkwise-top100-commission-result
          path: linkwise-top100-commission-result.json
          if-no-files-found: ignore
          retention-days: 14
