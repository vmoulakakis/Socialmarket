name: Market Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  workflow_run:
    workflows: ['Niche Discovery']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  research:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: workers/market_intelligence
    env:
      SUPABASE_WORKER_GATEWAY: https://prrehmcvpyhupvlhtbzg.supabase.co/functions/v1/github-worker-gateway
      MAX_CATEGORIES: '40'
      MAX_PRODUCTS_PER_CATEGORY: '60'
      MAX_NICHES: '120'
      FORECAST_WEEKS: '8'
      MIN_VALIDITY_DAYS: '20'
      SELLER_COMPETITION_KILL: '82'
      AD_PRESSURE_PROXY_KILL: '92'
      AD_PRESSURE_MIN_CONFIDENCE: '0.65'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run category-level Greece market intelligence
        env:
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
        run: python run_oidc.py | tee market-output.json
      - name: Run semantic micro-niche market intelligence
        env:
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
        run: python run_niche_market.py | tee niche-market-output.json
      - name: Refine HIGO with merchant trust and niche evidence
        run: python post_rank_refinement.py | tee higo-refinement-output.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-output
          path: |
            workers/market_intelligence/market-output.json
            workers/market_intelligence/niche-market-output.json
            workers/market_intelligence/higo-refinement-output.json
