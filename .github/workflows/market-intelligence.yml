name: Market Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  id-token: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: workers/market_intelligence
    env:
      SUPABASE_WORKER_GATEWAY: https://prrehmcvpyhupvlhtbzg.supabase.co/functions/v1/github-worker-gateway
      MAX_CATEGORIES: '40'
      MAX_PRODUCTS_PER_CATEGORY: '60'
      FORECAST_WEEKS: '8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run Greece market intelligence
        env:
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
        run: python run_oidc.py | tee market-output.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-output
          path: workers/market_intelligence/market-output.json
