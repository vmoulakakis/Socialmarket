name: Merchant Intelligence V4.3 CI

on:
  push:
    branches: [main]
    paths:
      - 'workers/market_intelligence/semantic_taxonomy.py'
      - 'workers/market_intelligence/merchant_intelligence_v43.py'
      - 'workers/market_intelligence/test_semantic_taxonomy_v43.py'
      - '.github/workflows/merchant-intelligence-v43*.yml'
  pull_request:
    paths:
      - 'workers/market_intelligence/semantic_taxonomy.py'
      - 'workers/market_intelligence/merchant_intelligence_v43.py'
      - 'workers/market_intelligence/test_semantic_taxonomy_v43.py'
      - '.github/workflows/merchant-intelligence-v43*.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile semantic resolver
        run: python -m py_compile workers/market_intelligence/semantic_taxonomy.py workers/market_intelligence/merchant_intelligence_v43.py
      - name: Run v4.3 false-positive regression scenarios
        working-directory: workers/market_intelligence
        run: python -m unittest -v test_semantic_taxonomy_v43.py
      - name: Guard against whole-corpus merchant classification
        run: |
          grep -q 'resolve_merchant_taxonomy' workers/market_intelligence/merchant_intelligence_v43.py
          grep -q "anchors=()" workers/market_intelligence/merchant_intelligence_v43.py
          grep -q "category_market_owner.*semantic_category_pain_v2" workers/market_intelligence/merchant_intelligence_v43.py
