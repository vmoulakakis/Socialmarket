name: Model Router Smoke Fix

on:
  push:
    branches: [fix/model-router-fallback-v2]
    paths:
      - 'workers/ai_runtime/ollama_executor.py'
      - '.github/workflows/model-router-smoke-fix.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_OLLAMA_URL: http://127.0.0.1:11434
      LOCAL_LLM_RETRIES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama-selector-smoke.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS "$LOCAL_OLLAMA_URL/api/tags" >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen3.5:4b
      - name: Test selector contract like a shopper
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'workers/ai_runtime')
          from ollama_executor import OllamaExecutor
          from task_contract import AITask

          task=AITask(
              task_type='selector_user_smoke',role='Greek shopping intent classifier',
              instructions=(
                  'Classify only the user_query. intent must be security, pool, cleaning, style, or other. '
                  'If the user is leaving for holidays and wants to monitor the house, intent must be security. '
                  'confidence must be between 0 and 1.'
              ),
              payload={'user_query':'Φεύγω διακοπές και θέλω να βλέπω το σπίτι'},
              required_keys=('intent','confidence'),cacheable=False,max_tier=2,
          )
          ex=OllamaExecutor(name='selector-smoke',tier=2,model='qwen3.5:4b',timeout_seconds=90,max_output_tokens=120)
          assert ex.available(task), 'qualified Qwen 4B unavailable'
          data,telemetry=ex.run(task)
          assert str(data.get('intent')).lower() == 'security', data
          assert 0 <= float(data.get('confidence')) <= 1, data
          assert telemetry.get('route') == 'local_ollama', telemetry
          assert telemetry.get('structured_output') is True, telemetry
          assert float(telemetry.get('cost_usd') or 0) == 0, telemetry
          print({'PASS':True,'intent':data.get('intent'),'route':telemetry.get('route'),'model':telemetry.get('model'),'attempt':telemetry.get('attempt_no'),'cost_usd':0})
          PY
