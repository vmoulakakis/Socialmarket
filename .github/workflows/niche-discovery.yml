name: Niche Discovery
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Merchant Trust Research']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  discover:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: workers/market_intelligence
    env:
      SUPABASE_WORKER_GATEWAY: https://prrehmcvpyhupvlhtbzg.supabase.co/functions/v1/github-worker-gateway
      NICHE_MAX_CATEGORIES: '35'
      NICHE_MAX_PRODUCTS_PER_CATEGORY: '1200'
      NICHE_MIN_PRODUCTS: '8'
      NICHE_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core clustering dependencies
        run: pip install -r requirements.txt scikit-learn
      - name: Install optional semantic stack
        continue-on-error: true
        run: pip install bertopic sentence-transformers
      - name: Discover semantic micro-niches from preferred trusted offers only
        run: python discover_niches.py | tee niche-output.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: niche-output
          path: workers/market_intelligence/niche-output.json
