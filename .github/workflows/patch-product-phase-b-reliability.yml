name: Patch Product Phase B Reliability

on:
  push:
    branches: [fix/product-phase-b-json-price-outliers]
    paths:
      - '.github/workflows/patch-product-phase-b-reliability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-phase-b-json-price-outliers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: pip install ijson
      - name: Apply reliability patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path,old,new,count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if s.count(old)<count: raise SystemExit(f'pattern missing in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          ps='workers/product_intelligence/product_safety.py'
          rep(ps,
          "PRICE_HIGH_VALUE_UNVERIFIED=float(os.getenv('PRODUCT_PRICE_HIGH_VALUE_UNVERIFIED','1000'))\n",
          "PRICE_HIGH_VALUE_UNVERIFIED=float(os.getenv('PRODUCT_PRICE_HIGH_VALUE_UNVERIFIED','1000'))\nPRICE_EXTREME_OUTLIER_MULTIPLIER=float(os.getenv('PRODUCT_PRICE_EXTREME_OUTLIER_MULTIPLIER','10'))\n")
          rep(ps,
          "def price_integrity_allows(price,merchant_safety):\n    info=(merchant_safety or {}).get('price_integrity') or {'status':'no_price_evidence','confidence':0}\n    status=info.get('status')\n    if status in ('minor_unit_risk','no_price_evidence'):\n        return False,'price_scale_unverified',info\n    if status=='limited_evidence' and price>=PRICE_HIGH_VALUE_UNVERIFIED and _integerish(price):\n        return False,'price_scale_insufficient_evidence_high_value',info\n    return True,'price_major_unit_probable',info\n",
          "def price_integrity_allows(price,merchant_safety):\n    info=(merchant_safety or {}).get('price_integrity') or {'status':'no_price_evidence','confidence':0}\n    status=info.get('status')\n    if status in ('minor_unit_risk','no_price_evidence'):\n        return False,'price_scale_unverified',info\n    if status=='limited_evidence' and price>=PRICE_HIGH_VALUE_UNVERIFIED and _integerish(price):\n        return False,'price_scale_insufficient_evidence_high_value',info\n    p90=float(info.get('p90') or 0)\n    # Per-record fail-closed gate: catches mixed-unit/outlier rows even when the merchant feed is mostly healthy.\n    # We never divide by 100 automatically; extreme values are quarantined for evidence-based review.\n    if p90>0 and _integerish(price) and price>=PRICE_HIGH_VALUE_UNVERIFIED and price>=p90*PRICE_EXTREME_OUTLIER_MULTIPLIER:\n        return False,'price_extreme_outlier_unverified',info\n    return True,'price_major_unit_probable',info\n")

          tp='workers/product_intelligence/test_product_intelligence.py'
          rep(tp,
          "    def test_price_integrity_allows_plausible_major_units(self):\n        info=classify_price_sample([19.99,25.5,40.0,75.9,120.0]*5)\n        self.assertEqual(info['status'],'major_unit_probable')\n        ok,reason,_=price_integrity_allows(120,{'price_integrity':info})\n        self.assertTrue(ok)\n        self.assertEqual(reason,'price_major_unit_probable')\n",
          "    def test_price_integrity_allows_plausible_major_units(self):\n        info=classify_price_sample([19.99,25.5,40.0,75.9,120.0]*5)\n        self.assertEqual(info['status'],'major_unit_probable')\n        ok,reason,_=price_integrity_allows(120,{'price_integrity':info})\n        self.assertTrue(ok)\n        self.assertEqual(reason,'price_major_unit_probable')\n\n    def test_price_integrity_quarantines_extreme_mixed_unit_row(self):\n        info=classify_price_sample([12.9,19.5,23.68,31.2,45.0,90.2]*30)\n        ok,reason,_=price_integrity_allows(3501,{'price_integrity':info})\n        self.assertFalse(ok)\n        self.assertEqual(reason,'price_extreme_outlier_unverified')\n")

          gp='supabase/functions/product-intelligence-gateway/index.ts'
          rep(gp,
          "async function deepseek(system:string,payload:unknown,action:'enrich'|'audit',requested:ThinkingMode='auto'){\n  if(!DEEPSEEK_KEY)throw new Error('deepseek_not_configured')\n  const decision=chooseThinking(payload,action,requested)\n  const body:any={model:DEEPSEEK_MODEL,temperature:0.1,max_tokens:decision.enabled?5000:2200,response_format:{type:'json_object'},messages:[{role:'system',content:system},{role:'user',content:`Return JSON only. Input:\n${JSON.stringify(payload)}`}] }\n  if(decision.enabled){body.thinking={type:'enabled'};body.reasoning_effort='high'}\n  else{body.thinking={type:'disabled'};body.reasoning_effort='low'}\n  const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':`Bearer ${DEEPSEEK_KEY}`},body:JSON.stringify(body)})\n  const raw=await r.text()\n  if(!r.ok)throw new Error(`deepseek_${r.status}:${raw.slice(0,800)}`)\n  const j=JSON.parse(raw);const content=j?.choices?.[0]?.message?.content\n  if(!content)throw new Error('deepseek_empty_content')\n  return {data:JSON.parse(content),thinking:decision}\n}\n",
          "async function deepseek(system:string,payload:unknown,action:'enrich'|'audit',requested:ThinkingMode='auto'){\n  if(!DEEPSEEK_KEY)throw new Error('deepseek_not_configured')\n  const decision=chooseThinking(payload,action,requested)\n  const call=async(maxTokens:number,retry=false)=>{\n    const body:any={model:DEEPSEEK_MODEL,temperature:0.1,max_tokens:maxTokens,response_format:{type:'json_object'},messages:[{role:'system',content:system},{role:'user',content:`Return one complete JSON object only. Do not truncate strings. ${retry?'This is a retry because the previous JSON was incomplete. Be concise. ':''}Input:\n${JSON.stringify(payload)}`}] }\n    if(decision.enabled){body.thinking={type:'enabled'};body.reasoning_effort='high'}\n    else{body.thinking={type:'disabled'};body.reasoning_effort='low'}\n    const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':`Bearer ${DEEPSEEK_KEY}`},body:JSON.stringify(body)})\n    const raw=await r.text()\n    if(!r.ok)throw new Error(`deepseek_${r.status}:${raw.slice(0,800)}`)\n    const j=JSON.parse(raw);const content=j?.choices?.[0]?.message?.content\n    if(!content)throw new Error('deepseek_empty_content')\n    return content\n  }\n  const first=await call(decision.enabled?5200:3000,false)\n  try{return {data:JSON.parse(first),thinking:{...decision,json_retry:false}}}\n  catch(firstError){\n    const second=await call(decision.enabled?6200:4200,true)\n    try{return {data:JSON.parse(second),thinking:{...decision,json_retry:true}}}\n    catch(secondError){throw new Error(`deepseek_invalid_json_after_retry:${String(secondError).slice(0,240)}`)}\n  }\n}\n")
          rep(gp,"version:'1.2'","version:'1.3'")
          # Better HTTP semantics: authentication remains 401; model/JSON failures are 500.
          rep(gp,
          "  }catch(e){console.error(e);return json({error:String(e instanceof Error?e.message:e)},401)}\n})\n",
          "  }catch(e){const msg=String(e instanceof Error?e.message:e);console.error(e);const status=['missing_oidc','oidc_not_allowed'].some(x=>msg.includes(x))?401:500;return json({error:msg},status)}\n})\n")
          PY
      - name: Validate
        run: |
          python -m py_compile workers/product_intelligence/product_safety.py workers/product_intelligence/product_intelligence_v1.py
          cd workers/product_intelligence && python -m unittest -v test_product_intelligence.py
      - name: Commit code only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/product_intelligence/product_safety.py workers/product_intelligence/test_product_intelligence.py supabase/functions/product-intelligence-gateway/index.ts
          git commit -m 'Harden mixed-unit price outliers and DeepSeek JSON reliability'
          git push origin HEAD:fix/product-phase-b-json-price-outliers
