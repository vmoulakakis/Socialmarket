name: Patch Product Safety Gates V2

on:
  push:
    branches: [hardening/product-price-saturation-gates]
    paths:
      - '.github/workflows/patch-product-safety-gates-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/product-price-saturation-gates

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Product Intelligence dependencies
        run: pip install -r workers/product_intelligence/requirements.txt

      - name: Reuse and execute validated patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          src=Path('.github/workflows/patch-product-safety-gates.yml').read_text(encoding='utf-8')
          match=re.search(r"          python - <<'PY'\n(.*?)\n          PY",src,re.S)
          if not match:
              raise SystemExit('patch script not found')
          script=textwrap.dedent(match.group(1))
          exec(compile(script,'patch-product-safety-gates','exec'),{})
          PY

      - name: Validate Python syntax and tests
        run: |
          python -m py_compile workers/product_intelligence/product_intelligence_v1.py workers/product_intelligence/product_safety.py workers/product_intelligence/product_commercial_scan.py
          cd workers/product_intelligence
          python -m unittest -v test_product_intelligence.py

      - name: Commit safety-gate implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/product_intelligence/product_intelligence_v1.py workers/product_intelligence/product_safety.py workers/product_intelligence/product_commercial_scan.py workers/product_intelligence/test_product_intelligence.py supabase/functions/product-intelligence-gateway/index.ts .github/workflows/product-intelligence-v1.yml
          git commit -m 'Harden Product Intelligence price, saturation and persistence gates'
          git push origin HEAD:hardening/product-price-saturation-gates
