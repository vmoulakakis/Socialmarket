name: Product Feed Contract Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-feed-contract-diagnostic.yml'
      - '.github/product-feed-contract-trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARQUET_FILE_ID: 1xLIEgM2lkrAkudRO-QEN1OOiY711gFPG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: pip install 'duckdb>=1.3,<2' 'gdown>=5.2,<6'
      - name: Download one read-only Parquet partition
        run: |
          gdown "$PARQUET_FILE_ID" -O part_0000.parquet
          test -s part_0000.parquet
          ls -lh part_0000.parquet
      - name: Diagnose feed schema and merchant identifiers
        run: python workers/product_intelligence/diagnose_product_feed_contract.py part_0000.parquet product-feed-contract.json
      - name: Upload diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: product-feed-contract
          retention-days: 7
          path: product-feed-contract.json
      - name: Remove source partition
        if: always()
        run: rm -f part_0000.parquet
