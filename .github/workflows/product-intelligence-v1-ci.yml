name: Product Intelligence V1 CI
# Validates both fixed safety invariants and runtime-configurable business policy.

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/product_intelligence/**'
      - 'agents/skills/product-*/**'
      - 'agents/skills/merchant-product-bridge/**'
      - 'agents/skills/seasonal-demand-theme/**'
      - 'agents/ORCHESTRATOR.md'
      - 'supabase/functions/product-intelligence-gateway/**'
      - 'supabase/functions/product-config-gateway/**'
      - 'supabase/migrations/031_product_intelligence_v1.sql'
      - 'supabase/migrations/*product_intelligence*.sql'
      - '.github/workflows/product-intelligence-v1*.yml'
  push:
    branches: [main]
    paths:
      - 'workers/product_intelligence/**'
      - 'supabase/functions/product-intelligence-gateway/**'
      - 'supabase/functions/product-config-gateway/**'
      - 'supabase/migrations/*product_intelligence*.sql'
      - '.github/workflows/product-intelligence-v1*.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Product Intelligence dependencies
        run: pip install -r workers/product_intelligence/requirements.txt
      - name: Compile Product Intelligence workers
        run: python -m py_compile workers/product_intelligence/*.py
      - name: Run deterministic policy, shortlist, single-parse staging, feed transport and missing-data tests
        working-directory: workers/product_intelligence
        run: python -m unittest -v test_product_intelligence.py test_candidate_shortlist.py test_product_concentration.py test_missing_semantics.py test_night_brain_single_parse_stage.py test_linkwise_direct_feed.py
      - name: Guard against legacy minimum-price policy
        run: |
          if grep -R "MIN_PRICE\|price_not_over_50\|price > 50\|price >= 50" workers/product_intelligence; then
            echo 'Legacy product price gate detected in Product Intelligence'
            exit 1
          fi
      - name: Verify safety floor, pain-first shortlist and runtime configuration bridge
        run: |
          grep -R "PRODUCT_MIN_COMMISSION_EUR" workers/product_intelligence/product_intelligence_v1.py
          grep -R "dominant_or_blocked_merchant" workers/product_intelligence/product_intelligence_v1.py
          grep -R "min_expected_commission_eur" workers/product_intelligence/runtime_config.py
          grep -R "pre_ai_no_validated_pain_match" workers/product_intelligence/candidate_shortlist.py
          grep -R "pain_first_diversified_v2" workers/product_intelligence/product_intelligence_v2.py
          grep -R "disabled_as_kill_switch" workers/product_intelligence/product_safety.py
          grep -R "competition_inverse_bonus_withheld" workers/product_intelligence/runtime_config.py
          grep -R "validated_pain_required" supabase/functions/product-intelligence-gateway/index.ts
