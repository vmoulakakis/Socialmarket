name: Product Intelligence + Promotion Ranking

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'
  workflow_run:
    workflows: ['Deep Demand Intelligence V3.1']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/product-intelligence-trigger'

concurrency:
  group: socialmarket-product-ranking-daily
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  product-intelligence:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DRIVE_FILE_ID: 1oGnQr4uz3dxfHhydEYkYsrXeZJjR65HT
      PRODUCT_SOURCE_FEED: linkwise-products.json
      PRODUCT_REUSE_STAGE_DB: 'true'
      PRODUCT_MIN_MERCHANT_TRUST: '0'
      PRODUCT_INTELLIGENCE_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/product-intelligence-gateway
      PRODUCT_CONFIG_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/product-config-gateway
      PRODUCT_RANKING_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/product-ranking-gateway
      PRODUCT_CREATIVE_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/product-creative-gateway
      PRODUCT_RANK_RAG_PRESELECT: '20000'
      PRODUCT_RANK_PRESELECT: '5000'
      PRODUCT_RANK_AI_MAX: '320'
      PRODUCT_RANK_AI_WORKERS: '3'
      PRODUCT_RANK_SAVE_LIMIT: '200'
      PRODUCT_RANK_MIN_FINAL: '100'
      PRODUCT_RANK_SEO_LIMIT: '200'
      PRODUCT_RANK_SEO_BATCH: '10'
      PRODUCT_RANK_SEO_WORKERS: '3'
      PRODUCT_RANK_CREATIVE_LIMIT: '20'
      PRODUCT_RANK_CREATIVE_BATCH: '5'
      PRODUCT_RANK_CREATIVE_WORKERS: '3'
      PRODUCT_CREATIVE_ASSET_WORKERS: '4'
      PRODUCT_CREATIVE_BRAND_SLUG: lyseis-pou-axizoun

    steps:
      - uses: actions/checkout@v4

      - name: Preflight ranking + creative gateways
        id: preflight
        run: |
          python - <<'PY'
          import json, os, urllib.request
          urls={
            'ranking':'https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/product-ranking-gateway',
            'creative':'https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/product-creative-gateway',
          }
          health={}
          for name,url in urls.items():
              with urllib.request.urlopen(url, timeout=30) as r: health[name]=json.loads(r.read().decode())
              print(name,{k:health[name].get(k) for k in ('ok','service','version','deepseek_configured','deepseek_model','contract')})
              if not health[name].get('ok'): raise SystemExit(f'{name} gateway unhealthy')
          ai_ok=all(x.get('deepseek_configured') for x in health.values())
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"ranking_ai={'true' if ai_ok else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/product_intelligence/requirements.txt

      - name: Install product intelligence dependencies
        run: pip install -r workers/product_intelligence/requirements.txt

      - name: Download source feed read-only from Drive
        run: |
          gdown "$DRIVE_FILE_ID" -O "$PRODUCT_SOURCE_FEED"
          test -s "$PRODUCT_SOURCE_FEED"
          python - <<'PY'
          from pathlib import Path
          p=Path('linkwise-products.json')
          print({'feed_bytes':p.stat().st_size})
          if p.stat().st_size < 3_000_000_000:
              raise SystemExit('Source feed unexpectedly small; refusing incomplete product run')
          PY

      - name: Phase A — deterministic commercial universe scan
        run: python workers/product_intelligence/product_commercial_scan.py "$PRODUCT_SOURCE_FEED"

      - name: Final Ranking V3.5 — Top 100+ + SEO + 60 durable Top-20 creative assets
        if: steps.preflight.outputs.ranking_ai == 'true'
        run: python workers/product_intelligence/product_ranking_v32.py "$PRODUCT_SOURCE_FEED"

      - name: Fail if final AI services are unavailable
        if: steps.preflight.outputs.ranking_ai != 'true'
        run: |
          echo 'Final ranking requires both ranking and creative AI gateways. No partial production list will be published.'
          exit 1

      - name: Upload compact decision profiles only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-ranking-daily-profile
          retention-days: 30
          path: |
            product-commercial-scan-profile.json
            product-commercial-scan-sample.json
            product-feed-safety-profile.json
            product-ranking-v3-profile.json

      - name: Remove raw feed and local staging from runner
        if: always()
        run: rm -f "$PRODUCT_SOURCE_FEED" product-stage.sqlite3 product-stage.sqlite3-wal product-stage.sqlite3-shm
