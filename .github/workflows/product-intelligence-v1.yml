name: Product Intelligence V1

on:
  workflow_dispatch:
  schedule:
    - cron: '40 1 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/product-intelligence-trigger'
      - '.github/workflows/product-intelligence-v1.yml'

concurrency:
  group: socialmarket-product-intelligence-v1
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  product-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DRIVE_FILE_ID: 1oGnQr4uz3dxfHhydEYkYsrXeZJjR65HT
      PRODUCT_SOURCE_FEED: linkwise-products.json
      PRODUCT_MIN_COMMISSION_EUR: '10'
      PRODUCT_MIN_MERCHANT_TRUST: '30'
      PRODUCT_AI_BATCH: '1'
      PRODUCT_AI_MAX_CANDIDATES: '4'
      PRODUCT_AI_OFFERS_PER_PRODUCT: '1'
      PRODUCT_REUSE_STAGE_DB: 'true'
      PRODUCT_INTELLIGENCE_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/product-intelligence-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Preflight Product Intelligence gateway
        id: preflight
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url='https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/product-intelligence-gateway'
          with urllib.request.urlopen(url, timeout=30) as r:
              health=json.loads(r.read().decode())
          safe={k:health.get(k) for k in ('ok','service','version','deepseek_configured','deepseek_model')}
          print(safe)
          if not health.get('ok'):
              raise SystemExit('Product Intelligence gateway unhealthy')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"deepseek_configured={'true' if health.get('deepseek_configured') else 'false'}\n")
              f.write(f"deepseek_model={health.get('deepseek_model') or ''}\n")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/product_intelligence/requirements.txt

      - name: Install streaming dependencies
        run: pip install -r workers/product_intelligence/requirements.txt

      - name: Download source feed read-only from Drive
        run: |
          gdown "$DRIVE_FILE_ID" -O "$PRODUCT_SOURCE_FEED"
          test -s "$PRODUCT_SOURCE_FEED"
          python - <<'PY'
          from pathlib import Path
          p=Path('linkwise-products.json')
          print({'feed_bytes':p.stat().st_size})
          if p.stat().st_size < 3_000_000_000:
              raise SystemExit('Source feed unexpectedly small; refusing incomplete product run')
          PY

      - name: Phase A — price integrity + merchant resolution + dynamic saturation + commission gate
        run: python workers/product_intelligence/product_commercial_scan.py "$PRODUCT_SOURCE_FEED"

      - name: Phase B — bounded Merchant/Pain/Theme RAG + Product Research + Skeptic Audit + VALIDATED-only persistence
        if: steps.preflight.outputs.deepseek_configured == 'true'
        run: python workers/product_intelligence/product_intelligence_v1.py "$PRODUCT_SOURCE_FEED"

      - name: AI phase intentionally blocked when DeepSeek is absent
        if: steps.preflight.outputs.deepseek_configured != 'true'
        run: echo 'Phase A completed. Phase B skipped because DeepSeek is not configured in the shared Supabase Edge environment. No products were persisted by the scan.'

      - name: Upload run profiles only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-intelligence-v1-profile
          retention-days: 30
          path: |
            product-commercial-scan-profile.json
            product-commercial-scan-sample.json
            product-feed-safety-profile.json
            product-intelligence-profile.json

      - name: Remove raw feed and local staging from runner
        if: always()
        run: rm -f "$PRODUCT_SOURCE_FEED" product-stage.sqlite3 product-stage.sqlite3-wal product-stage.sqlite3-shm
