name: AFFINITY Semantic Marketplace 200

on:
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'normal=delta-first, policy_rebuild=bounded re-eval, full_rebuild=exceptional full scan'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - policy_rebuild
          - full_rebuild
  push:
    branches: [main]
    paths:
      - '.github/trigger-marketplace-200'

concurrency:
  group: affinity-semantic-marketplace-200
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  discover-audit-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MARKETPLACE200_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/marketplace200-agent-gateway
      MARKETPLACE200_AI_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/marketplace200-ai-gateway
      MARKETPLACE_INCREMENTAL_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/marketplace-incremental-gateway
      MARKETPLACE_SOCIAL_FUNNEL_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/marketplace-social-funnel-gateway
      ALIEXPRESS_AFFILIATE_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/aliexpress-affiliate-gateway
      PRODUCT_SOURCE_FEED: linkwise-products.json
      MARKETPLACE200_PROFILE_PATH: semantic-marketplace-200-profile.json
      MARKETPLACE200_LINKWISE_AI_PER_CLUSTER: '12'
      MARKETPLACE200_ALI_RESEARCH_PER_CLUSTER: '12'
      MARKETPLACE200_AI_BATCH: '2'
      MARKETPLACE200_AI_WORKERS: '6'
      MARKETPLACE200_DAILY_HANDOFF: '10'
      LINKWISE_SHARD_WORKERS: '6'
      LINKWISE_PROGRAM_WORKERS: '6'
      MARKETPLACE200_DELTA_REFILL_LINKWISE: '300'
      MARKETPLACE200_DELTA_REFILL_ALIEXPRESS: '300'
      MARKETPLACE200_FORCE_BOUNDED_REEVAL: '0'
      MARKETPLACE200_RUN_MODE: ${{ github.event.inputs.run_mode || 'normal' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded runtime dependencies
        run: pip install --disable-pip-version-check requests ijson

      - name: Verify production gateways
        run: |
          python - <<'PY'
          import json,urllib.request
          urls={
            'data':'https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/marketplace200-agent-gateway',
            'ai':'https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/marketplace200-ai-gateway',
            'incremental':'https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/marketplace-incremental-gateway',
            'social':'https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/marketplace-social-funnel-gateway',
            'ali':'https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/aliexpress-affiliate-gateway',
          }
          out={}
          for key,url in urls.items():
              with urllib.request.urlopen(url,timeout=30) as r:out[key]=json.loads(r.read().decode())
          print({'data':out['data'].get('ok'),'ai':out['ai'].get('ok'),'incremental':out['incremental'],'social':out['social'].get('ok'),'ali':out['ali']})
          assert out['data'].get('ok') is True
          assert out['ai'].get('ok') is True
          assert out['incremental'].get('ok') is True
          assert out['incremental'].get('strategy')=='baseline-once-then-product-deltas'
          assert out['social'].get('ok') is True
          assert out['ali'].get('ok') is True
          assert out['ali'].get('configured') is True
          assert out['ali'].get('tracking_configured') is True
          PY

      - name: Delta-first discovery with bounded refill
        run: python workers/product_intelligence/semantic_marketplace_200_smart_v3.py

      - name: Verify immutable quality and diversification invariants
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path('semantic-marketplace-200-profile.json').read_text())
          assert p.get('status')=='completed',p
          counts=p.get('selected_counts') or {}
          assert int(counts.get('linkwise') or 0)<=100,p
          assert int(counts.get('aliexpress') or 0)<=100,p
          assert int(counts.get('total') or 0)<=200,p
          assert int((p.get('caps') or {}).get('merchant_max') or 0)<=2,p
          assert int((p.get('caps') or {}).get('seller_max') or 0)<=2,p
          policy=p.get('hard_policy') or {}
          assert policy.get('commission_gt_eur')==30,p
          assert policy.get('product_quality_min')==75,p
          assert policy.get('affinity_min')==76,p
          link=(p.get('stages') or {}).get('linkwise_full_feed') or {}
          ali=(p.get('stages') or {}).get('aliexpress_api') or {}
          mode=os.getenv('MARKETPLACE200_RUN_MODE','normal')
          if mode!='full_rebuild':
              assert link.get('mode') in ('baseline_once','trusted_program_delta'),p
              assert ali.get('mode')=='product_delta',p
              if link.get('mode')=='trusted_program_delta':
                  assert 'trusted_programs' in link,p
                  assert 'new_or_changed' in link,p
                  assert 'unchanged' in link,p
              assert ali.get('delta_strategy') in ('search_fingerprint_then_details_with_bounded_refill','search_fingerprint_then_details'),p
          print({'run_mode':mode,'run_id':p.get('run_id'),'counts':counts,'caps':p.get('caps'),'linkwise_mode':link.get('mode'),'linkwise_delta':link.get('new_or_changed'),'ali_delta':ali.get('new_or_changed'),'ali_strategy':ali.get('delta_strategy'),'handoff':(p.get('handoff') or {}).get('products_handed_off')})
          PY

      - name: Upload auditable production profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-marketplace-200-${{ github.run_number }}
          path: semantic-marketplace-200-profile.json
          if-no-files-found: error
          retention-days: 30
