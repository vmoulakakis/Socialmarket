name: Session social publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: session-social-publisher
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/social_publisher/requirements.txt

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workers/social_publisher/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Prepare due no-app publish jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOCIAL_SESSION_KEY: ${{ secrets.SOCIAL_SESSION_KEY }}
          SOCIAL_WORKER_ID: github-actions
          SOCIAL_BROWSER_HEADLESS: 'true'
        run: python -m workers.social_publisher.worker --limit 5
