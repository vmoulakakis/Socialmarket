name: Legacy Greece Top100 V2 — manual only

# RETIRED FROM PRODUCTION SCHEDULING.
# Canonical production discovery is .github/workflows/semantic-marketplace-200.yml.
# This workflow remains manual-only for historical diagnostics and rollback research.
on:
  workflow_dispatch:

concurrency:
  group: socialmarket-legacy-top100-v2
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  select-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TOP100_AGENT_GATEWAY: https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/top100-agent-gateway
      TOP100_POOL_LIMIT: '350'
      TOP100_SCARCITY_PROBE_LIMIT: '300'
      TOP100_SCARCITY_WORKERS: '8'
      TOP100_DAILY_HANDOFF_LIMIT: '0'
      TOP100_PROFILE_PATH: top100-autonomous-v2-profile.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Historical diagnostic only
        run: |
          echo 'Legacy Top100 V2 has been retired from production scheduling.'
          echo 'Use AFFINITY Semantic Marketplace 200 for current product discovery.'
